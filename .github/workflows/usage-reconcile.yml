name: AI usage cost roll-up

# Post token/cost roll-up on the parent story when implementation is complete.
# Triggers: last child PR merges (all children closed), or parent story issue closed.

on:
  pull_request:
    types: [closed]

  issues:
    types: [closed]

  workflow_dispatch:
    inputs:
      story:
        description: Parent story issue number (optional — scans closed stories if omitted)
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile-on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/github-script@v7
        id: closing-issues
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const { data } = await github.graphql(
              `query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 50) {
                      nodes {
                        number
                        state
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, pr: prNumber }
            );

            const issues = data.repository.pullRequest.closingIssuesReferences.nodes;
            const closed = issues
              .filter((issue) => issue.state === 'CLOSED')
              .filter((issue) => {
                const labels = issue.labels.nodes.map((l) => l.name);
                if (labels.includes('story')) return false;
                if (labels.includes('answered')) return false;
                return true;
              })
              .map((issue) => issue.number);

            core.setOutput('issues', JSON.stringify(closed));
            core.info(`Closed implementation issues from PR: ${closed.join(', ') || 'none'}`);

      - name: Post cost roll-up when story complete
        if: steps.closing-issues.outputs.issues != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_ADMIN_API_KEY: ${{ secrets.CURSOR_ADMIN_API_KEY }}
          CLOSED_ISSUE_NUMBERS: ${{ steps.closing-issues.outputs.issues }}
        run: node scripts/usage/reconcile-on-merge.mjs

  reconcile-on-story-close:
    if: |
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'story')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post cost roll-up on story close
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_ADMIN_API_KEY: ${{ secrets.CURSOR_ADMIN_API_KEY }}
        run: node scripts/usage/reconcile.mjs --story ${{ github.event.issue.number }} --post

  reconcile-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post cost roll-up (manual)
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_ADMIN_API_KEY: ${{ secrets.CURSOR_ADMIN_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.story }}" ]; then
            node scripts/usage/reconcile.mjs --story ${{ github.event.inputs.story }} --post
          else
            node scripts/usage/reconcile-on-merge.mjs --scan-stories
          fi
