site_name: Calculator AI Demo
site_url: https://irenadimitrova1.github.io/calculator-ai-demo/
repo_url: https://github.com/irenadimitrova1/calculator-ai-demo
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.action.edit

nav:
  - Home: index.md
  - Product:
      - Vision: product/vision.md
      - Roadmap: product/roadmap.md
      - Features:
          - Calculator PoC: product/features/calculator-poc.md
          - Calculator v1: product/features/calculator-v1.md
          - Calculator v2: product/features/calculator-v2.md
          - Calculator v3: product/features/calculator-v3.md
          - Calculator v4: product/features/calculator-v4.md
          - Calculator v5: product/features/calculator-v5.md
          - Calculator v6: product/features/calculator-v6.md
          - Calculator v7: product/features/calculator-v7.md
          - Calculator v8: product/features/calculator-v8.md
          - Calculator v9: product/features/calculator-v9.md
          - Calculator v10: product/features/calculator-v10.md
  - Process:
      - How we plan: process/how-we-plan.md
      - Definition of Ready: process/definition-of-ready.md
      - Feature doc to issues: process/feature-to-issues.md
  - Engineering:
      - Overview: engineering/index.md
      - ADRs: adr/index.md
      - Agent configuration:
          - Workflow: agents/workflow.md
          - Issue tracker: agents/issue-tracker.md
          - Triage labels: agents/triage-labels.md
          - Domain docs: agents/domain.md
  - Contributing: contributing.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
